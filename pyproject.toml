[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-lite"
version = "1.0.0"
description = "Lightweight Linux authentication log analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
siem-lite = "logsiem.main:main"

[tool.setuptools.packages.find]
include = ["logsiem*"]
